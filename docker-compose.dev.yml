version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: votechain_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-votechain_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-votechain_password}
      POSTGRES_DB: ${POSTGRES_DB:-votechain_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-votechain_user} -d ${POSTGRES_DB:-votechain_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local
