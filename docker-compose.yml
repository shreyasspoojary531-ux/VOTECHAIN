version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: votechain_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-votechain_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-votechain_password}
      POSTGRES_DB: ${POSTGRES_DB:-votechain_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-votechain_user} -d ${POSTGRES_DB:-votechain_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: votechain_backend
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-votechain_user}:${POSTGRES_PASSWORD:-votechain_password}@postgres:5432/${POSTGRES_DB:-votechain_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-replace-in-production-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
