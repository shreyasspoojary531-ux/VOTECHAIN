version: '3.8'

services:
  # PostgreSQL Database Instance
  postgres:
    image: postgres:16-alpine
    container_name: votechain-postgres
    restart: always
    environment:
      POSTGRES_USER: votechain_user
      POSTGRES_PASSWORD: votechain_secret_password
      POSTGRES_DB: votechain_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votechain_user -d votechain_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Express Backend API Service (Scalable Replicas)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgresql://votechain_user:votechain_secret_password@postgres:5432/votechain_db?schema=public
      JWT_SECRET: super_secret_jwt_key_votechain_2026_demo
      JWT_EXPIRES_IN: 1d
      OTP_PEPPER: super_secret_otp_pepper_votechain_2026
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  # Nginx Load Balancer for Backend API Scaling
  loadbalancer:
    image: nginx:alpine
    container_name: votechain-loadbalancer
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  # Next.js Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    container_name: votechain-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - loadbalancer

volumes:
  postgres_data:
